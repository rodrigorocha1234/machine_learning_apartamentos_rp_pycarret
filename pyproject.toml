[project]
name = "imoveis-antigravity"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7", "pandas>=2.2,<3", "openpyxl>=3.1,<4"]
[project.optional-dependencies]
# Versão 4.0.0a0 ALPHA: validar instalação e APIs antes de uso real.
pycaret4 = ["pycaret==4.0.0a0"]
dev = ["pytest>=8,<10", "pyright>=1.1"]
[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

