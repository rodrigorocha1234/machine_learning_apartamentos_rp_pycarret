  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 10s

  api:
    image: python:3.12-slim
    container_name: api-fastapi
    profiles:
      - servico_ml
      - api
    depends_on:
      storage:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      - S3_ENDPOINT_URL=http://storage:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-rustfs_admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-RustFS@2026Admin}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - MLFLOW_TRACKING_URI=http://mlflow-server:${MLFLOW_PORT:-5000}
      - MLFLOW_SERVING_URL=http://mlflow-serving:8080
      - PYTHONPATH=/app
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - .:/app:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir fastapi uvicorn requests boto3 botocore mypy-boto3-s3 pyarrow PyYAML prometheus-client scikit-learn mlflow-skinny
        python -m uvicorn app.servico_api.aplicacao_fastapi:criar_aplicacao --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      mlflow-network:
        ipv4_address: 172.20.0.34
    restart: unless-stopped

networks:
  mlflow-network:
    name: mlflow-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16