# ==============================================================================
# Etapa 4: Modelagem de Regressão, Pré-processamento e Tuning
# ==============================================================================
# Define o framework de treinamento (pycaret ou sklearn), estratégias de
# imputação, pré-processamento, catálogo de modelos e hiperparâmetros de tuning.
# ==============================================================================

modelagem:
  motor_treino: "sklearn" # pycaret | sklearn

  imputacao:
    ativo: false
    estrategia_numerica: "mediana" # mediana | media | mais_frequente | constante
    estrategia_categorica: "mais_frequente" # mais_frequente | constante
    valor_constante_numerico: 0.0
    valor_constante_categorico: "Ausente"
    adicionar_indicador: false
    por_atributo:
      Metragem:
        ativo: false
        estrategia: "mediana"
      Bairro:
        ativo: false
        estrategia: "mais_frequente"

  preprocessamento:
    transformar_alvo: false
    metodo_transformacao_alvo: "log1p" # log1p | log | yeo-johnson | box-cox
    transformar_atributos:
      ativo: false
      metodo: "log1p"
      colunas:
        - "Metragem"

  modelos:
    - {nome: "regressao_linear", ativo: true, pycaret_id: "lr", sklearn_class: "LinearRegression", preprocessador: "standard"}
    - {nome: "lasso", ativo: true, pycaret_id: "lasso", sklearn_class: "Lasso", preprocessador: "standard"}
    - {nome: "ridge", ativo: true, pycaret_id: "ridge", sklearn_class: "Ridge", preprocessador: "standard"}
    - {nome: "elasticnet", ativo: true, pycaret_id: "en", sklearn_class: "ElasticNet", preprocessador: "standard"}
    - {nome: "arvore_decisao", ativo: true, pycaret_id: "dt", sklearn_class: "DecisionTreeRegressor", preprocessador: "nenhum"}
    - {nome: "random_forest", ativo: true, pycaret_id: "rf", sklearn_class: "RandomForestRegressor", preprocessador: "nenhum"}
    - {nome: "svr", ativo: true, pycaret_id: "svm", sklearn_class: "SVR", preprocessador: "robust"}
    - {nome: "rede_neural", ativo: true, pycaret_id: "mlp", sklearn_class: "MLPRegressor", preprocessador: "standard"}
    - {nome: "xgboost", ativo: true, pycaret_id: "xgboost", sklearn_class: "XGBRegressor", preprocessador: "nenhum"}
    - {nome: "lightgbm", ativo: true, pycaret_id: "lightgbm", sklearn_class: "LGBMRegressor", preprocessador: "nenhum"}

  validacao_cruzada:
    ativo: true
    tecnica: "kfold" # kfold | repeated_kfold | shuffle_split | time_series_split
    parametros:
      kfold:
        n_splits: 3
        shuffle: true
        random_state: 42
      repeated_kfold:
        n_splits: 5
        n_repeats: 3
        random_state: 42
      shuffle_split:
        n_splits: 5
        test_size: 0.2
        random_state: 42
      time_series_split:
        n_splits: 3
        max_train_size: null

  tuning:
    ativo: true
    metodo: "random" # random | grid | bayesian | optuna
    otimizar_metrica: "RMSE" # RMSE | MAE | R2 | RMSLE
    iteracoes: 10
    manter_melhor: true # Mantém modelo baseline se o tuning degradar performance
    early_stopping: false # Parada antecipada em buscas iterativas
    parametros:
      regressao_linear:
        ativo: true
        fit_intercept: [true, false]
        positive: [false, true]
      lasso:
        ativo: true
        alpha: [0.001, 0.01, 0.1, 1.0, 10.0]
        fit_intercept: [true, false]
        max_iter: [1000, 2000]
        tol: [0.0001, 0.001]
        selection: ["cyclic", "random"]
      ridge:
        ativo: true
        alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
        fit_intercept: [true, false]
        solver: ["auto", "svd", "cholesky", "lsqr"]
        tol: [0.0001, 0.001]
      elasticnet:
        ativo: true
        alpha: [0.01, 0.1, 1.0, 10.0]
        l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
        fit_intercept: [true, false]
        max_iter: [1000, 2000]
        tol: [0.0001, 0.001]
      arvore_decisao:
        ativo: true
        criterion: ["squared_error", "friedman_mse", "absolute_error"]
        max_depth: [3, 5, 8, 12]
        min_samples_split: [2, 5, 10]
        min_samples_leaf: [1, 2, 4]
        max_features: [null, "sqrt", "log2"]
      random_forest:
        ativo: true
        n_estimators: [50, 100, 150]
        criterion: ["squared_error", "absolute_error"]
        max_depth: [5, 8, 12]
        min_samples_split: [2, 5, 10]
        min_samples_leaf: [1, 2, 4]
        max_features: [1.0, "sqrt", "log2"]
        bootstrap: [true]
      svr:
        ativo: true
        kernel: ["rbf", "linear"]
        C: [0.1, 1.0, 10.0, 100.0]
        epsilon: [0.01, 0.1, 0.2]
        gamma: ["scale", "auto"]
      rede_neural:
        ativo: true
        hidden_layer_sizes: [[50], [100], [50, 25], [100, 50]]
        activation: ["relu", "tanh"]
        solver: ["adam", "lbfgs"]
        alpha: [0.0001, 0.001, 0.01]
        learning_rate_init: [0.001, 0.01]
        max_iter: [200, 400]
      xgboost:
        ativo: true
        n_estimators: [50, 100, 150]
        learning_rate: [0.01, 0.05, 0.1, 0.2]
        max_depth: [3, 5, 7]
        subsample: [0.7, 0.85, 1.0]
        colsample_bytree: [0.7, 0.85, 1.0]
        min_child_weight: [1, 3, 5]
        reg_alpha: [0.0, 0.1, 1.0]
        reg_lambda: [0.01, 1.0, 10.0]
      lightgbm:
        ativo: true
        n_estimators: [50, 100, 150]
        learning_rate: [0.01, 0.05, 0.1, 0.2]
        max_depth: [3, 5, 7]
        num_leaves: [15, 31, 63]
        colsample_bytree: [0.7, 0.85, 1.0]
        min_child_samples: [5, 10, 20]
        reg_alpha: [0.0, 0.1, 1.0]
        reg_lambda: [0.01, 1.0, 10.0]

  mlflow:
    tracking_uri: "${MLFLOW_TRACKING_URI:http://localhost:5000}"
    experimento: "apartamento_rp_regressao"
    modelo_registrado: "previsao_preco_imoveis"
    registrar_modelo_campeao: true
